# 主页仓库 zhongdahuang.github.io：每周一从 ORCID 拉论文、重新生成页面；改 profile.yaml 后推送也会触发。
name: Build homepage
on:
  push:
    branches: [main]
    paths: [profile.yaml, template.html, build.py]
  schedule:
    - cron: "17 14 * * 1"   # 每周一 14:17 UTC（温哥华 07:17）
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python build.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html papers.json profile-README.md
          git diff --cached --quiet || git commit -m "Rebuild from ORCID and profile.yaml" && git push
