teaching:
  intro: >-
    I have taught mathematics for seven years, including complete courses at UBC
    Okanagan and Okanagan College. In lectures I explain the reasoning behind each
    method before students practise it. I write assignments at three levels,
    foundational, application and extension, so that students with different
    preparation can all make progress.
