about: >-
  I am a PhD student in mathematics at UBC Okanagan, advised by Warren Hare and
  Amir Ardestani-Jaafari.

research: >-
  I study optimization problems in which each function evaluation is expensive,
  such as a simulation of a scanner design or a gradient computed over a large
  dataset. Cheaper approximations of these problems are often available, but the
  work spent on them must be justified by the saving on the original problem.
  I develop derivative-free and multi-fidelity methods that decide how to use such
  approximations, analyze their convergence, and apply them to engineering design
  and epidemiological modelling.

