# 报告：date 写 YYYY-MM-DD 或 YYYY-MM；title、abstract 可留空；invited: true 显示 invited 标记。
# 这里的报告会自动进入 News（最近 news_months 个月内）。
talks:
  - date: 2026-06-23
    invited: true
    title: "Multiobjective multifidelity derivative-free optimization for optical CT scanner design: from empirical warm-starts to convergence-guided fidelity scheduling"
    authors: Z. Huang, J. Ryga, A. Ogilvy, A. Ardestani-Jaafari, A. Jirasek, W. Hare
    event: Third Derivative-Free Optimization Symposium (DFOS 2026)
    place: Université de Montréal
    links:
      - label: code
        url: https://github.com/zhongdahuang/MO-STD
    abstract: >-
      Optical computed tomography (CT) scanners are powerful imaging tools used in
      three-dimensional radiation dosimetry to reconstruct dose distributions in gel
      dosimeters. Solid-tank scanners embed the gel in an acrylic block, replacing large
      fluid baths and simplifying setup. We formulate solid-tank fan-beam design as a
      multiobjective problem balancing imaging extent, uniformity, and ray-crossover
      artifacts. We build a ray-tracing simulator with objective-specific performance
      measures and a multifidelity setting controlled by ray count. To search efficiently,
      we employ the Non-dominated Sorting Genetic Algorithm (NSGA-II-ws) within a
      multifidelity framework that incrementally escalates simulation fidelity and uses
      Pareto-optimal survivors from one level to initialize the next. Performance
      comparisons indicate that NSGA-II-ws achieves higher-quality solutions within
      comparable runtime to standard NSGA-II.
      Motivated by this framework, we develop a theoretical foundation for multi-fidelity
      warm-start optimization under smooth and strongly convex objectives. For the
      two-level setting, we establish iteration bounds quantifying how low-fidelity
      progress reduces high-fidelity complexity and characterize the optimal allocation
      of iterations between fidelity levels, including closed-form cost-minimizing splits.
      We extend the analysis to M-level hierarchies, formalizing when and why
      multi-fidelity warm-start strategies yield computational savings and providing
      guidance for designing provably efficient multi-fidelity optimization frameworks.
  - date: 2025-10-18
    title: A multiobjective multifidelity optimization approach for design of scanners for use in optical CT imaging
    authors: Z. Huang, J. Ryga, A. Ogilvy, A. Ardestani-Jaafari, A. Jirasek, W. Hare
    event: West Coast Optimization Meeting (WCOM Fall 2025)
    place: UBC Okanagan
    links:
      - label: code
        url: https://github.com/zhongdahuang/MO-STD
    abstract: >-
      Optical computed tomography (CT) scanners are powerful imaging tools used in three
      dimensional radiation dosimetry to reconstruct dose distributions in gel dosimeters.
      Solid-tank scanners embed the gel in an acrylic block, replacing large fluid baths
      and simplifying setup. We formulate solid-tank, fan-beam design as a multiobjective
      problem balancing imaging extent, uniformity, and ray-crossover artifacts. We build
      a ray-tracing simulator with new, objective-specific performance measures and a
      multifidelity setting controlled by ray count. To search efficiently, we employ a
      warm-start Non-dominated Sorting Genetic Algorithm (NSGA-II-ws), which incrementally
      escalates simulation fidelity and uses the Pareto-optimal survivors from one fidelity
      stage to initialize the population at the next. Our method illustrates the advantages
      of a multiobjective framework to reveal deeper insights into design trade-offs, avoid
      biased outcomes, and support robust lens selection. Moreover, performance comparison
      indicates that the NSGA-II-ws method achieves higher-quality solutions within a
      comparable runtime to the standard NSGA-II approach.
  - date: 2025-06
    title:        # 待补
    event: CORS 2025 Annual Conference
    place: Edmonton
  - date: 2022-07-19
    invited: true
    title: A hybrid direct search and model-based derivative-free optimization method with dynamic decision processing and application
    event: "BIRS workshop Derivative-Free Optimization: Linking Algorithms and Applications (22w5199)"
    place: UBC Okanagan
    abstract: >-
      A derivative-free optimization (DFO) method is a type of optimization method that
      does not make use of derivative information in order to find the optimal solution.
      In this talk, we develop the framework for a DFO method, referred to as the smart DQL
      method. It is designed to be a versatile hybrid method capable of performing direct
      search, quadratic-model search, and line search all in the same method. The smart DQL
      method is applied to the problem of solid tank design for 3D radiation dosimetry. We
      show that, given the same evaluation budget, the smart DQL method produces a
      higher-quality solution than the Grid Search method that was originally employed by
      the UBCO 3D Radiation Dosimetry Research Group.
